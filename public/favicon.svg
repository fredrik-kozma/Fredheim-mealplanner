<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Mirrors the in-app brand icon: indigo rounded square + fork, plate,
       knife rendered as paths. Using paths instead of the 🍽 emoji glyph
       means the icon looks identical on every OS — iOS, Android,
       Windows, browser tabs — instead of relying on each platform's
       emoji font. -->
  <rect width="100" height="100" rx="22" fill="#4f46e5"/>

  <!-- Plate (centre) — outer ring + thin inner rim, hollow so it reads
       as a plate rather than a disc -->
  <circle cx="50" cy="55" r="22" fill="none" stroke="#ffffff" stroke-width="3"/>
  <circle cx="50" cy="55" r="14" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.55"/>

  <!-- Fork (left) — 3 tines, connector, handle -->
  <g fill="#ffffff">
    <rect x="17"   y="13" width="2.5" height="14" rx="1"/>
    <rect x="22"   y="13" width="2.5" height="14" rx="1"/>
    <rect x="27"   y="13" width="2.5" height="14" rx="1"/>
    <rect x="17"   y="25" width="12.5" height="4" rx="1.5"/>
    <rect x="22"   y="29" width="2.5"  height="56" rx="1.25"/>
  </g>

  <!-- Knife (right) — tapered blade + slim handle -->
  <g fill="#ffffff">
    <path d="M 71 13
             L 78 13
             L 78 50
             L 76 52
             L 71 50 Z"/>
    <rect x="73" y="50" width="3" height="35" rx="1.5"/>
  </g>
</svg>
